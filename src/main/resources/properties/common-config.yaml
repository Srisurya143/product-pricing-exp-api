api:
  Name: "product-pricing-exp-api"
  Version: "1.0.0"
  status: "Running"

http:
  listener:
    host: "0.0.0.0"
    port: "8081"
    basePath: "/api/"
    path: "v1/*"
    readTimeout: "30000"
    keystore:
      path: "certs/listener.jks"
    truststore:
      path: "certs/truststore.jks"
    connection:
      idealTimeout: "40000"
https:
  port: "8092"

  
httpRetry:
  frequency: "2000"
  attempts: "3"
  

  
step:
  processStart: "Process start"
  processEnd: "Process End"
  flowStart: "Flow Start"
  flowEnd: "Flow End"
  beforeRequest: "Before Request"
  afterRequest: "After Request"
  
errorLogger:
  transactionlevel: "Error"
  status: "Error"